<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Scientific Calculator - Smart Calculation Made Simple">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- Title bar with theme toggle -->
    <header class="head">
      <div>
        <h1>SCIENTIFIC CALCULATOR</h1>
        <p class="subtitle">Smart Calculation Made Simple</p>
      </div>
      <button id="themeToggle" class="icon-btn" data-action="theme" aria-label="Switch between dark and light theme">☀️</button>
    </header>

    <div class="layout">
      <!-- ===== Calculator ===== -->
      <section class="calc glass" id="calc" aria-label="Scientific calculator">
        <!-- Display: expression on top, result below -->
        <div class="display">
          <div class="badges"><span id="modeBadge">DEG</span><span id="memBadge" hidden>M</span></div>
          <div id="expression" class="expression" aria-label="Current expression">0</div>
          <div id="result" class="result" role="status" aria-live="polite" aria-label="Result">0</div>
        </div>

        <!-- Toolbar: mode, copy, memory -->
        <div class="toolbar">
          <button class="btn special" data-action="mode" id="modeBtn" aria-label="Switch between degrees and radians">DEG</button>
          <button class="btn special" data-action="copy" aria-label="Copy result to clipboard">Copy</button>
          <button class="btn mem" data-action="mc" aria-label="Memory clear">MC</button>
          <button class="btn mem" data-action="mr" aria-label="Memory recall">MR</button>
          <button class="btn mem" data-action="mplus" aria-label="Add to memory">M+</button>
          <button class="btn mem" data-action="mminus" aria-label="Subtract from memory">M-</button>
        </div>

        <div class="keys">
          <!-- Scientific functions -->
          <div class="pad sci-pad" role="group" aria-label="Scientific functions">
            <button class="btn sci" data-insert="sin(" aria-label="Sine">sin</button>
            <button class="btn sci" data-insert="cos(" aria-label="Cosine">cos</button>
            <button class="btn sci" data-insert="tan(" aria-label="Tangent">tan</button>
            <button class="btn sci" data-insert="sin⁻¹(" aria-label="Inverse sine">sin⁻¹</button>
            <button class="btn sci" data-insert="cos⁻¹(" aria-label="Inverse cosine">cos⁻¹</button>
            <button class="btn sci" data-insert="tan⁻¹(" aria-label="Inverse tangent">tan⁻¹</button>
            <button class="btn sci" data-insert="log(" aria-label="Logarithm base 10">log</button>
            <button class="btn sci" data-insert="ln(" aria-label="Natural logarithm">ln</button>
            <button class="btn sci" data-insert="√(" aria-label="Square root">√</button>
            <button class="btn sci" data-insert="∛(" aria-label="Cube root">∛</button>
            <button class="btn sci" data-insert="^2" aria-label="Square">x²</button>
            <button class="btn sci" data-insert="^3" aria-label="Cube">x³</button>
            <button class="btn sci" data-insert="^" aria-label="Power">xʸ</button>
            <button class="btn sci" data-insert="!" aria-label="Factorial">n!</button>
            <button class="btn sci" data-insert="^(-1)" aria-label="Reciprocal">1/x</button>
            <button class="btn sci" data-insert="π" aria-label="Pi">π</button>
            <button class="btn sci" data-insert="e" aria-label="Euler's number">e</button>
            <button class="btn sci" data-insert="abs(" aria-label="Absolute value">|x|</button>
            <button class="btn sci" data-insert="e^(" aria-label="e to the power x">eˣ</button>
            <button class="btn sci" data-insert="10^(" aria-label="10 to the power x">10ˣ</button>
          </div>

          <!-- Numbers and arithmetic -->
          <div class="pad basic-pad" role="group" aria-label="Numbers and operators">
            <button class="btn special" data-action="clear" aria-label="All clear">AC</button>
            <button class="btn special" data-action="delete" aria-label="Delete last entry">DEL</button>
            <button class="btn op" data-insert="(" aria-label="Open parenthesis">(</button>
            <button class="btn op" data-insert=")" aria-label="Close parenthesis">)</button>
            <button class="btn num" data-insert="7">7</button>
            <button class="btn num" data-insert="8">8</button>
            <button class="btn num" data-insert="9">9</button>
            <button class="btn op" data-insert="÷" aria-label="Divide">÷</button>
            <button class="btn num" data-insert="4">4</button>
            <button class="btn num" data-insert="5">5</button>
            <button class="btn num" data-insert="6">6</button>
            <button class="btn op" data-insert="×" aria-label="Multiply">×</button>
            <button class="btn num" data-insert="1">1</button>
            <button class="btn num" data-insert="2">2</button>
            <button class="btn num" data-insert="3">3</button>
            <button class="btn op" data-insert="-" aria-label="Subtract">−</button>
            <button class="btn num" data-insert="0">0</button>
            <button class="btn num" data-insert="." aria-label="Decimal point">.</button>
            <button class="btn op" data-insert="%" aria-label="Percent">%</button>
            <button class="btn op" data-insert="+" aria-label="Add">+</button>
            <button class="btn equals" data-action="equals" aria-label="Calculate result">=</button>
          </div>
        </div>
      </section>

      <!-- ===== History ===== -->
      <aside class="history glass" aria-label="Calculation history">
        <div class="history-head">
          <h2>History</h2>
          <button class="btn special small" data-action="clearHistory" aria-label="Clear calculation history">Clear</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
      </aside>
    </div>

    <footer>Developed as an Engineering Student Project</footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
